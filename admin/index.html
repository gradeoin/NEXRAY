<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard — Nexray</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="stylesheet" href="../css/global.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>" />
  <style>
    body { overflow: hidden; }
    .admin-wrap { display: flex; min-height: 100vh; padding-top: var(--nav-h); }
    .admin-main { flex: 1; overflow-y: auto; }
    .data-table { width: 100%; border-collapse: collapse; font-size: .85rem; }
    .data-table th { text-align: left; padding: 10px 14px; color: var(--text-3); font-size: .72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; border-bottom: 1px solid var(--glass-b); }
    .data-table td { padding: 12px 14px; border-bottom: 1px solid var(--glass-b); color: var(--text-2); }
    .data-table tr:hover td { background: var(--bg-card-h); }
    .admin-section { margin-bottom: 2.5rem; }
    .admin-section-title { font-family: 'Space Grotesk', sans-serif; font-size: 1.05rem; font-weight: 700; margin-bottom: 1rem; display: flex; align-items: center; gap: .5rem; }
    .badge-dot { width: 8px; height: 8px; border-radius: 50%; background: #4ade80; display: inline-block; animation: pulse-dot 2s ease infinite; }
    @keyframes pulse-dot { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.5;transform:scale(.8)} }
    @media(max-width:768px){.admin-sidebar{display:none}.admin-main{overflow-y:auto;height:calc(100vh - var(--nav-h))}}
  </style>
</head>
<body>
<nav class="nav">
  <a href="../index.html" class="nav-logo"><div class="logo-icon"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg></div><span>Nex<span class="logo-accent">ray</span> <span style="font-size:.65rem;padding:2px 8px;background:var(--brand-dim);border:1px solid var(--brand-glow);border-radius:99px;color:var(--brand);font-weight:700;font-family:'Inter',sans-serif;vertical-align:middle;">ADMIN</span></span></a>
  <div class="nav-links">
    <span class="badge-dot"></span>
    <span style="color:var(--text-2);font-size:.82rem;">Live</span>
    <a href="../index.html" class="btn-secondary" style="padding:6px 14px;border-radius:99px;font-size:.82rem;background:var(--glass);border:1px solid var(--glass-b);color:var(--text-2);display:inline-flex;align-items:center;gap:.375rem;">
      <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      View Site
    </a>
    <div class="theme-toggle"><button class="theme-btn" data-theme="dark">Dark</button><button class="theme-btn" data-theme="light">Light</button><button class="theme-btn" data-theme="neon">Neon</button></div>
  </div>
</nav>

<div class="admin-wrap">
  <!-- Sidebar -->
  <aside class="admin-sidebar">
    <div style="font-size:.7rem;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:.08em;padding:.5rem .875rem;margin-bottom:.5rem;">Menu</div>

    <div class="admin-nav-item active" onclick="showSection('dashboard',this)">
      Dashboard
    </div>
    <div class="admin-nav-item" onclick="showSection('users',this)">Users</div>
    <div class="admin-nav-item" onclick="showSection('blog',this)">Blog Posts</div>
    <div class="admin-nav-item" onclick="showSection('analytics',this)">Analytics</div>
    <div class="admin-nav-item" onclick="showSection('settings',this)">Settings</div>

    <div style="flex:1"></div>
  </aside>

  <!-- Main Content -->
  <main class="admin-main">
    <div id="section-dashboard" class="admin-section-wrap" style="padding:2rem;">

      <!-- Recent Users -->
      <div class="admin-section">
        <div class="admin-section-title">Recent Users</div>
        <div class="glass-card" style="padding:0;overflow:hidden;">
          <table class="data-table">
            <thead><tr><th>User</th><th>Email</th><th>Signs Up</th><th>Progress</th><th>XP</th></tr></thead>
            <tbody id="users-table-body">
              <tr><td colspan="5">Loading...</td></tr>
            </tbody>
          </table>
        </div>
      </div>

    </div>

    <!-- Other sections -->
    <div id="section-users" class="admin-section-wrap" style="display:none;padding:2rem;">
      <h2 class="admin-section-title">Users — Live Firebase Data</h2>
      <p>Connected to Firestore users collection.</p>
    </div>

    <div id="section-blog" class="admin-section-wrap" style="display:none;padding:2rem;">
      <h2 class="admin-section-title">Blog Posts</h2>
    </div>

    <div id="section-analytics" class="admin-section-wrap" style="display:none;padding:2rem;">
      <h2 class="admin-section-title">Analytics</h2>
    </div>

    <div id="section-settings" class="admin-section-wrap" style="display:none;padding:2rem;">
      <h2 class="admin-section-title">Settings</h2>
    </div>
  </main>
</div>

<script>
  function showSection(id, btn) {
    document.querySelectorAll('.admin-section-wrap').forEach(s => s.style.display = 'none');
    document.getElementById('section-' + id).style.display = 'block';
    document.querySelectorAll('.admin-nav-item').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  }
</script>

<!-- ⭐ FIREBASE + USERS FETCH -->
<script type="module">

  /* --- Firebase Imports --- */
  import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
  import { getFirestore, collection, getDocs } 
    from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

  /* --- Your Firebase Config --- */
  const firebaseConfig = {
    apiKey: "AIzaSyBzM68THLIm9Njdps5XMcvkdnzzvL3l7EQ",
    authDomain: "nexray-d66fb.firebaseapp.com",
    projectId: "nexray-d66fb",
    storageBucket: "nexray-d66fb.firebasestorage.app",
    messagingSenderId: "714253399201",
    appId: "1:714253399201:web:77679145c51f0243b92ce0",
    measurementId: "G-4Q8W67SGYB"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  /* --- Load Users Table --- */
  async function loadUsers() {
    const tbody = document.getElementById("users-table-body");
    tbody.innerHTML = "<tr><td colspan='5'>Loading users...</td></tr>";

    const querySnapshot = await getDocs(collection(db, "users"));

    tbody.innerHTML = "";

    querySnapshot.forEach(doc => {
      const u = doc.data();

      const row = `
        <tr>
          <td style="color:var(--text);">${u.name || "Unknown"}</td>
          <td>${u.email || "-"}</td>
          <td>${u.signupDate || "-"}</td>
          <td><span class="badge">${u.progress || "0/7"} Stages</span></td>
          <td><span class="xp-badge">${u.xp || 0} XP</span></td>
        </tr>
      `;
      tbody.insertAdjacentHTML("beforeend", row);
    });

    if (!querySnapshot.size) {
      tbody.innerHTML = "<tr><td colspan='5'>No users found.</td></tr>";
    }
  }

  document.addEventListener("DOMContentLoaded", loadUsers);

</script>

</body>
</html>
