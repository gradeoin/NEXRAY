<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07070b"/>
      <stop offset="1" stop-color="#101018"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff5a1f"/>
      <stop offset="1" stop-color="#ff8a4c"/>
    </linearGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="32"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <circle cx="200" cy="80" r="180" fill="#ff5a1f" opacity="0.20" filter="url(#blur)"/>
  <circle cx="1080" cy="130" r="220" fill="#ff8a4c" opacity="0.16" filter="url(#blur)"/>
  <circle cx="700" cy="610" r="240" fill="#ff5a1f" opacity="0.12" filter="url(#blur)"/>

  <rect x="70" y="90" width="1060" height="450" rx="28" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.14)"/>
  <rect x="95" y="120" width="220" height="44" rx="22" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.14)"/>
  <text x="120" y="150" font-family="Arial, sans-serif" font-size="18" fill="#ffd2c2">2026 • Zero → Pro</text>

  <text x="95" y="250" font-family="Arial, sans-serif" font-size="64" font-weight="700" fill="#ffffff">NEXRAY</text>
  <text x="95" y="320" font-family="Arial, sans-serif" font-size="42" font-weight="700" fill="url(#acc)">Learn Web Dev from Zero → Pro</text>
  <text x="95" y="380" font-family="Arial, sans-serif" font-size="22" fill="rgba(255,255,255,0.80)">
    Multi‑page guide: HTML/CSS/JS → Backend → DevOps → Pro tricks → Android app → SEO & marketing
  </text>

  <text x="95" y="480" font-family="Arial, sans-serif" font-size="16" fill="rgba(255,255,255,0.65)">
    Built with modern glass UI + orange theme + three.js vibes
  </text>
