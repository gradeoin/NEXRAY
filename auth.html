<div class="page-wrapper" style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem 1.5rem;">
  <div style="width:100%;max-width:420px;">

    <!-- Logo -->
    <div style="text-align:center;margin-bottom:2rem;">
      <a href="index.html" class="nav-logo" aria-label="Nexray Home" style="display:flex; align-items:center; text-decoration:none;">
    <img src="https://res.cloudinary.com/djy0vsvfg/image/upload/v1774822889/logo_highres_hdmcey.png" alt="Nexray Logo" class="nav-logo-img" style="height:36px; width:auto; border-radius:8px; box-shadow: 0 4px 12px rgba(0, 56, 255, 0.3);">
    <span style="font-family: 'Arial Black', Impact, sans-serif; font-weight: 900; font-size: 1.35rem; letter-spacing: 1px; margin-left: 10px; color: var(--text); text-transform: uppercase;">NEX<span class="logo-accent" style="color: var(--brand);">RAY</span></span>
  </a>
      <h1 style="font-family:'Space Grotesk',sans-serif;font-size:1.6rem;font-weight:800;margin-bottom:.375rem;">Welcome back</h1>
      <p style="color:var(--text-2);font-size:.9rem;">Sign in to save your progress and earn XP</p>
    </div>

    <div class="auth-card">
      <!-- Google Sign In -->
      <button class="btn-google" id="google-signin-btn" type="button">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
        Continue with Google
      </button>

      <div class="form-divider"><span>or sign in with email</span></div>

      <!-- Email form -->
      <form id="signin-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="email">Email address</label>
          <input class="form-input" type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required />
        </div>
        <div class="form-group">
          <label class="form-label" for="password" style="display:flex;justify-content:space-between;">
            Password
            <a href="#" style="color:var(--brand);font-weight:500;font-size:.8rem;">Forgot?</a>
          </label>
          <input class="form-input" type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" required />
        </div>
        <button type="submit" class="btn btn-primary btn-full" style="margin-top:.25rem;">Sign In</button>
      </form>

      <p id="auth-error" style="color:#f87171;font-size:.82rem;margin-top:.75rem;display:none;text-align:center;"></p>

      <div style="text-align:center;margin-top:1.25rem;font-size:.85rem;color:var(--text-2);">
        Don't have an account?
        <a href="auth.html?mode=signup" style="color:var(--brand);font-weight:600;">Create one →</a>
      </div>
    </div>

    <!-- Benefits -->
    <div style="margin-top:1.5rem;display:flex;flex-direction:column;gap:.5rem;">

        <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#4ade80" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
        Earn XP and track completion
      </div>
      <div style="display:flex;align-items:center;gap:.625rem;color:var(--text-2);font-size:.82rem;">
        <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#4ade80" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
        Completely free — no credit card
      </div>
    </div>

    <p style="text-align:center;color:var(--text-3);font-size:.72rem;margin-top:1.5rem;">
      By signing in you agree to our <a href="terms.html" style="color:var(--text-2)">Terms</a> and <a href="privacy.html" style="color:var(--text-2)">Privacy Policy</a>.
    </p>
  </div>
</div>

<!-- Firebase SDK -->
<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.14.0/firebase-app.js';
  import { getAuth, signInWithPopup, GoogleAuthProvider, signInWithEmailAndPassword, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.14.0/firebase-auth.js';
  import { getAnalytics } from 'https://www.gstatic.com/firebasejs/10.14.0/firebase-analytics.js';

  const firebaseConfig = {
    apiKey: "AIzaSyBzM68THLIm9Njdps5XMcvkdnzzvL3l7EQ",
    authDomain: "nexray-d66fb.firebaseapp.com",
    projectId: "nexray-d66fb",
    storageBucket: "nexray-d66fb.firebasestorage.app",
    messagingSenderId: "714253399201",
    appId: "1:714253399201:web:77679145c51f0243b92ce0",
    measurementId: "G-4Q8W67SGYB"
  };

  const app = initializeApp(firebaseConfig);
  const analytics = getAnalytics(app);
  const auth = getAuth(app);
  const googleProvider = new GoogleAuthProvider();
  googleProvider.setCustomParameters({ prompt: 'select_account' });

  // Redirect if already signed in
  onAuthStateChanged(auth, (user) => {
    if (user) {
      // Save minimal user info to localStorage for global quick access in main.js
      localStorage.setItem('nexray_user', JSON.stringify({
        displayName: user.displayName || 'Developer',
        photoURL: user.photoURL || 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=100&q=80',
        loggedIn: true
      }));
      window.location.href = 'index.html';
    }
  });

  // Google Sign In
  document.getElementById('google-signin-btn').addEventListener('click', async () => {
    try {
      const result = await signInWithPopup(auth, googleProvider);
      localStorage.setItem('nexray_user', JSON.stringify({
        displayName: result.user.displayName,
        photoURL: result.user.photoURL,
        loggedIn: true
      }));
      window.location.href = 'index.html';
    } catch (err) {
      showError('Google sign in failed: ' + err.message);
    }
  });

  // Email Sign In
  document.getElementById('signin-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = e.target.querySelector('button');
    btn.disabled = true;
    btn.textContent = 'Signing in...';
    
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    try {
      const result = await signInWithEmailAndPassword(auth, email, password);
      localStorage.setItem('nexray_user', JSON.stringify({
        displayName: result.user.email.split('@')[0],
        photoURL: 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=100&q=80',
        loggedIn: true
      }));
      window.location.href = 'index.html';
    } catch (err) {
      btn.disabled = false;
      btn.textContent = 'Sign In';
      showError(err.code === 'auth/invalid-credential' ? 'Invalid email or password.' : err.message);
    }
  });

  function showError(msg) {
    const el = document.getElementById('auth-error');
    if (el) {
      el.textContent = msg;
      el.style.display = 'block';
    }
  }
</script>
<script type="module" src="js/auth.js"></script>

</body>
