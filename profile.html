<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your Dashboard — Nexray</title>
  <meta name="description" content="Manage your Nexray profile, track learning progress, and customize your developer identity." />
  <meta name="robots" content="noindex" />
  <link rel="stylesheet" href="css/global.css" />
  <link rel="icon" href="https://res.cloudinary.com/djy0vsvfg/image/upload/v1774822889/logo_highres_hdmcey.png" />
  <style>
    .profile-avatar-ring {
      width: 110px; height: 110px;
      border-radius: 50%;
      border: 3px solid var(--brand);
      box-shadow: 0 0 24px var(--brand-glow);
      overflow: hidden;
      margin: 0 auto 1rem;
      background: var(--bg-card);
    }
    .profile-avatar-ring img { width: 100%; height: 100%; object-fit: cover; display: block; }

    .avatar-option {
      padding: 8px;
      border-radius: var(--radius);
      border: 2px solid transparent;
      background: var(--bg-card);
      cursor: pointer;
      transition: all 0.2s;
      aspect-ratio: 1;
      display: flex; align-items: center; justify-content: center;
    }
    .avatar-option:hover { border-color: var(--brand-glow); transform: scale(1.05); }
    .avatar-option.selected { border-color: var(--brand); box-shadow: 0 0 14px var(--brand-glow); }
    .avatar-option img { width: 100%; display: block; }

    .profile-edit-field {
      width: 100%;
      padding: 10px 14px;
      background: var(--bg-card);
      border: 1px solid var(--glass-b);
      border-radius: var(--radius);
      color: var(--text);
      font-size: 0.95rem;
      font-family: inherit;
      transition: border-color 0.2s;
      box-sizing: border-box;
    }
    .profile-edit-field:focus { outline: none; border-color: var(--brand); }
    .profile-edit-field:disabled { opacity: 0.5; cursor: not-allowed; }

    .save-toast {
      position: fixed;
      bottom: 2rem; right: 2rem;
      background: var(--brand);
      color: #fff;
      padding: 0.75rem 1.5rem;
      border-radius: var(--radius-full);
      font-weight: 700;
      font-size: 0.9rem;
      z-index: 9999;
      transform: translateY(6rem);
      opacity: 0;
      transition: transform 0.3s ease, opacity 0.3s ease;
      pointer-events: none;
    }
    .save-toast.show { transform: translateY(0); opacity: 1; }

    .stat-pill {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: var(--bg-card);
      border: 1px solid var(--glass-b);
      border-radius: var(--radius);
      padding: 1rem;
      text-align: center;
    }
    .stat-pill-value {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.6rem; font-weight: 900; color: var(--brand);
    }
    .stat-pill-label {
      font-size: 0.7rem; color: var(--text-3);
      text-transform: uppercase; letter-spacing: 0.06em; margin-top: 0.2rem;
    }
    .progress-stage-bar { height: 6px; background: var(--glass-b); border-radius: 99px; overflow: hidden; margin-top: 0.5rem; }
    .progress-stage-bar-fill { height: 100%; background: var(--brand-gradient); border-radius: 99px; transition: width 0.6s ease; }

    .quick-link:hover { color: var(--brand) !important; background: var(--brand-dim) !important; }

    @media (max-width: 700px) {
      .profile-grid { grid-template-columns: 1fr !important; }
    }
  </style>
  <meta name="theme-color" content="#0038FF">
<style>
.nx-icon{display:inline-block;width:1.1em;height:1.1em;vertical-align:-0.15em;stroke:currentColor;flex-shrink:0}
.nx-icon-success{stroke:#22c55e}
.nx-icon-error{stroke:#ef4444}
.nx-icon-accent{stroke:#CCFF00}
.nx-icon-hot{stroke:#f97316}
</style>
</head>
<body>
<div id="page-loader"><div class="loader-spinner"></div></div>
<div id="custom-cursor"></div>
<div class="save-toast" id="save-toast">✓ Saved!</div>

<nav class="nav" role="navigation">
  <a href="index.html" class="nav-logo">
    <img src="https://res.cloudinary.com/djy0vsvfg/image/upload/v1774822889/logo_highres_hdmcey.png" alt="Nexray Logo" style="height:36px;">
    <span style="font-family: 'Arial Black', sans-serif; font-weight: 900; color: var(--text);">NEX<span style="color: var(--brand);">RAY</span></span>
  </a>
  <div class="nav-links">
    <a href="index.html">Home</a>
    <a href="guide/stage1.html">Guide</a>
    <a href="blog/index.html">Blog</a>
    <a href="resources.html">Resources</a>
  </div>
</nav>

<div class="page-wrapper" style="padding-bottom: 5rem; padding-top: 100px;">
  <div class="container" style="max-width: 960px;">

    <div style="margin-bottom: 2rem;">
      <h1 style="font-family:'Space Grotesk',sans-serif; font-size: 2.5rem; font-weight: 900; margin-bottom: 0.3rem;">Your Dashboard</h1>
      <p style="color: var(--text-2);">Track your progress and manage your Nexray identity.</p>
    </div>

    <div class="profile-grid" style="display: grid; grid-template-columns: 270px 1fr; gap: 2rem; align-items: start;">
      <aside>
        <div class="glass-card text-center" style="padding: 2rem 1.5rem; margin-bottom: 1.25rem;">
          <div class="profile-avatar-ring">
            <img id="profile-img" src="" alt="Avatar" />
          </div>
          <h2 id="username-display" style="font-size: 1.25rem; font-weight: 900;">Developer</h2>
          <p id="email-display" style="font-size: 0.8rem; color: var(--text-3); margin-bottom: 1rem;"></p>
          <div id="level-badge" class="badge badge-brand" style="margin-bottom: 1.5rem;">🌱 Level 0</div>

          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; margin-bottom: 1.5rem;">
            <div class="stat-pill">
              <span class="stat-pill-value" id="xp-display">0</span>
              <span class="stat-pill-label">XP</span>
            </div>
            <div class="stat-pill">
              <span class="stat-pill-value" id="stages-done">0/7</span>
              <span class="stat-pill-label">Stages</span>
            </div>
          </div>

          <button id="logout-btn" class="btn btn-secondary btn-full">Sign Out</button>
        </div>
      </aside>

      <main>
        <div class="glass-card" style="margin-bottom: 1.25rem;">
          <h3 style="font-weight:900; margin-bottom:1rem;">Learning Progress</h3>
          <div style="margin-bottom:1.25rem;">
            <div style="display:flex; justify-content:space-between; font-size:0.8rem; color:var(--text-3); margin-bottom:5px;">
              <span>Overall Completion</span>
              <span id="progress-pct">0%</span>
            </div>
            <div class="progress-stage-bar"><div class="progress-stage-bar-fill" id="overall-bar" style="width:0%"></div></div>
          </div>
          <div id="progress-list"></div>
        </div>

        <div class="glass-card">
          <h3 style="font-weight:900; margin-bottom:1rem;">Profile Settings</h3>
          
          <label style="display:block; margin-bottom: 0.5rem; font-weight: 700; color: var(--text-2); font-size: 0.9rem;">Upload Custom Avatar</label>
          <input type="file" id="avatar-upload" accept="image/png, image/jpeg, image/webp" class="profile-edit-field" style="margin-bottom: 1.25rem;">
          
          <label style="display:block; margin-bottom: 0.5rem; font-weight: 700; color: var(--text-2); font-size: 0.9rem;">Display Name</label>
          <input type="text" id="username-input" class="profile-edit-field" placeholder="Enter your name" style="margin-bottom: 1.25rem;">
          
          <button id="save-profile-btn" class="btn btn-primary" style="letter-spacing: 0.05em;">Save Changes</button>
        </div>
      </main>
    </div>
  </div>
</div>

<script>
  window.addEventListener('load', () => {
    const loader = document.getElementById('page-loader');
    if (loader) {
      loader.style.opacity = '0';
      loader.style.pointerEvents = 'none';
      setTimeout(() => loader.style.display = 'none', 300);
    }
  });
</script>
<script>
  // Simple logout logic directly in the file to avoid CORS module restrictions
  function logout() {
    localStorage.removeItem('nexray_user');
    window.dispatchEvent(new CustomEvent('auth-state-changed', { detail: null }));
    window.location.href = 'index.html';
  }

  if (!localStorage.getItem('nexray_user')) { window.location.href = 'auth.html'; }

  function getUser() { return JSON.parse(localStorage.getItem('nexray_user') || '{}'); }
  function saveUser(u) { localStorage.setItem('nexray_user', JSON.stringify(u)); }

  function refreshUI() {
    const u = getUser();
    const progress = JSON.parse(localStorage.getItem('nexray_progress') || '{}');
    const completed = Object.keys(progress).filter(k => progress[k].status === 'completed').length;
    const inProgressCount = Object.keys(progress).length;

    const defaultAvatar = 'data:image/svg+xml;utf8,<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="12" cy="12" r="12" fill="%23f1f5f9"/><circle cx="12" cy="8" r="4" fill="%230038FF"/><path d="M12 14c-4.42 0-8 3.58-8 8h16c0-4.42-3.58-8-8-8z" fill="%230038FF"/></svg>';
    const imgEl = document.getElementById('profile-img');
    imgEl.src = u.photoURL || defaultAvatar;
    imgEl.onerror = () => { imgEl.src = defaultAvatar; };
    document.getElementById('username-display').textContent = u.displayName || 'Developer';
    document.getElementById('username-input').value = u.displayName || '';
    document.getElementById('email-display').textContent = u.email || 'Welcome to your Nexray dashboard';
    document.getElementById('xp-display').textContent = (completed * 150) + (inProgressCount * 50);
    document.getElementById('stages-done').textContent = `${completed}/7`;

    const lvl = document.getElementById('level-badge');
    if (completed >= 7) lvl.textContent = '<svg class="nx-icon nx-icon-accent" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17a1 1 0 0 1-1 1H8"/><path d="M14 14.66V17a1 1 0 0 0 1 1h1"/><path d="M8 22H6a2 2 0 0 1-2-2v-7a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v7a2 2 0 0 1-2 2h-2"/></svg> Level 7 — Pro';
    else if (completed >= 1) lvl.textContent = '<svg class="nx-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/><path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/></svg> Level 1 — Starter';
    else lvl.textContent = '🌱 Level 0 — Beginner';

    const pct = Math.round((completed / 7) * 100);
    document.getElementById('progress-pct').textContent = `${pct}%`;
    document.getElementById('overall-bar').style.width = `${pct}%`;
    
    renderStageList(progress);
  }

  function renderStageList(nProgress) {
    const stages = [
      { id:1, name:'The Foundations', desc:'HTML & CSS Basics' },
      { id:2, name:'The Frontend', desc:'JS & Modern Web' },
      { id:3, name:'The Backend', desc:'Node.js & APIs' },
      { id:4, name:'Deployment', desc:'Git & Cloud' },
      { id:5, name:'Optimization', desc:'Security & Speed' },
      { id:6, name:'Mobile Apps', desc:'Native Web Apps' },
      { id:7, name:'The Launch', desc:'Ship & Scale' }
    ];
    const list = document.getElementById('progress-list');
    list.innerHTML = '';
    stages.forEach(s => {
      const data = nProgress[`stage${s.id}`] || { status: 'locked' };
      const done = data.status === 'completed';
      const active = data.status === 'in-progress';
      
      const el = document.createElement('div');
      el.style = 'display:flex;justify-content:space-between;align-items:center;padding:1rem;background:rgba(255,255,255,0.03);border:1px solid var(--glass-b);border-radius:12px;margin-bottom:0.75rem;';
      el.innerHTML = `
        <div>
          <div style="font-weight:700;font-size:0.9rem;">Stage ${s.id}: ${s.name}</div>
          <div style="font-size:0.75rem;color:var(--text-3);">${s.desc}</div>
        </div>
        <div>
          ${done ? '<span class="badge badge-brand">✓ Done</span>' : 
            active ? '<a href="guide/stage'+s.id+'.html" class="btn btn-primary" style="padding:5px 12px;font-size:0.75rem;">Continue</a>' : 
            '<span style="font-size:0.75rem;color:var(--text-3);">Locked</span>'}
        </div>`;
      list.appendChild(el);
    });
  }

  document.getElementById('avatar-upload').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (!file) return;
    if (file.size > 2 * 1024 * 1024) {
      alert('Image must be under 2MB. Please choose a smaller file.');
      return;
    }
    const reader = new FileReader();
    reader.onload = function(evt) {
      const imgEl = document.getElementById('profile-img');
      imgEl.src = evt.target.result;
      imgEl.onerror = null;
      // Auto-save avatar immediately on selection
      const u = getUser();
      u.photoURL = evt.target.result;
      saveUser(u);
      window.dispatchEvent(new CustomEvent('auth-state-changed', { detail: u }));
    };
    reader.readAsDataURL(file);
  });

  document.getElementById('save-profile-btn').addEventListener('click', () => {
    const u = getUser();
    const nameVal = document.getElementById('username-input').value.trim();
    if (nameVal) u.displayName = nameVal;
    
    // Save avatar base64
    const imgData = document.getElementById('profile-img').src;
    if (imgData && imgData.startsWith('data:image')) {
       u.photoURL = imgData;
    }
    
    saveUser(u);
    refreshUI();
    const toast = document.getElementById('save-toast');
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 3000);
  });

  document.getElementById('logout-btn').onclick = () => logout();
  refreshUI();
</script>
<script src="js/mascot.js" defer></script>
  <script src="js/motion-svgs.js" defer></script>
</body>
</html>
