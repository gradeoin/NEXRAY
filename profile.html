<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your Dashboard — Nexray</title>
  <meta name="description" content="Manage your Nexray profile, track XP, and customize your developer avatar." />
  <meta name="robots" content="noindex" />
  <link rel="stylesheet" href="css/global.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/xml' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>" />
</head>
<body>
<div id="page-loader"><div class="loader-spinner"></div></div>
<div id="custom-cursor"></div>

<nav class="nav">
  <a href="index.html" class="nav-logo">
    <div class="logo-icon"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg></div>
    <span>Nex<span class="logo-accent">ray</span></span>
  </a>
  <div class="nav-links">
    <a href="index.html">Home</a>
    <a href="guide/stage1.html">Guide</a>
    <a href="blog/index.html">Blog</a>
    <a href="resources.html">Resources</a>
    <div class="theme-toggle"><button class="theme-btn" data-theme="dark">Dark</button><button class="theme-btn" data-theme="light">Light</button><button class="theme-btn" data-theme="neon">Neon</button></div>
    <div id="nav-user-block"></div>
  </div>
</nav>

<div class="page-wrapper" style="padding-top:100px; padding-bottom:80px;">
  <div class="container" style="max-width:900px;">
    
    <div class="grid-2 mt-md" style="grid-template-columns: 1fr 2fr; gap: 3rem; align-items: start;">
      
      <!-- User Profile Sidebar -->
      <aside class="reveal-left">
        <div class="glass-card text-center" style="position:relative; overflow:hidden; padding: 3rem 2rem;">
          <!-- 3D Avatar Canvas -->
          <div id="avatar-3d-canvas" style="width:180px; height:180px; margin:0 auto 2rem; border-radius:50%; background:var(--bg-card); position:relative; overflow:hidden; border:2px solid var(--brand-glow);">
            <img id="profile-img" src="" style="width:100%; height:100%; object-fit:cover; position:absolute; inset:0; z-index:2; opacity:0; transition:opacity 0.6s ease;" />
            <canvas id="avatar-scene" style="position:absolute; inset:0; z-index:1;"></canvas>
          </div>
          <h2 id="username" style="font-size:1.8rem; margin-bottom:0.5rem; font-family:'Fira Code',monospace; font-weight:900;">Developer</h2>
          <div class="badge badge-brand" style="margin-bottom:1.5rem;">Level 1 Hacker</div>
          
          <div style="display:flex; flex-direction:column; gap:1rem; text-align:left;">
            <div class="stat-card" style="padding:1.25rem;">
              <span class="stat-label">EXP EARNED</span>
              <span class="stat-value" style="font-size:1.5rem;" id="xp-count">300 XP</span>
            </div>
            <div class="stat-card" style="padding:1.25rem;">
              <span class="stat-label">RANK</span>
              <span class="stat-value" style="font-size:1.5rem;">TOP 12%</span>
            </div>
          </div>
          
          <button id="logout-btn" class="btn btn-secondary btn-full mt-xl" style="padding: 10px; font-size: 0.82rem;">Sign Out</button>
        </div>
      </aside>

      <!-- Profile Settings -->
      <main class="reveal-right">
        <h1 style="font-family:'Space Grotesk',sans-serif; font-size:2.5rem; font-weight:900; margin-bottom:1.5rem;">Profile Settings</h1>
        
        <div class="glass-card mb-md">
          <h3 style="font-weight:900; margin-bottom:1.5rem;">Customize Your Avatar</h3>
          <p style="color:var(--text-2); margin-bottom:2rem; font-size:0.9rem;">Pick an illustration or upload your own to represent your developer identity.</p>
          
          <div class="grid-4" style="gap:1rem;" id="avatar-picker-grid">
            <!-- Avatar choices injected by JS -->
          </div>
        </div>

        <div class="glass-card">
          <h3 style="font-weight:900; margin-bottom:1.5rem;">Learning Progress</h3>
          <div style="display:flex; flex-direction:column; gap:1rem;" id="progress-list">
             <!-- Progress tracked here -->
          </div>
        </div>
      </main>

    </div>
  </div>
</div>

<footer class="footer">
  <div class="footer-bottom">
    <span>© 2026 Nexray</span>
    <span>Launch Your Career</span>
  </div>
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script type="module">
  import { auth, logout } from './js/auth.js';

  const user = JSON.parse(localStorage.getItem('nexray_user'));
  if (!user) {
    window.location.href = 'auth.html';
  }

  // Update DOM with user info
  document.getElementById('username').textContent = user.displayName;
  const pImg = document.getElementById('profile-img');
  pImg.src = user.photoURL;
  pImg.onload = () => pImg.style.opacity = '1';

  document.getElementById('logout-btn').addEventListener('click', () => {
    if(confirm('Are you sure you want to sign out?')) {
      logout();
    }
  });

  // ── Avatar Picker ──────────────────────────────────────────
  const pickerGrid = document.getElementById('avatar-picker-grid');
  const avatars = [1, 2, 3, 4, 5, 6, 7, 8];
  avatars.forEach(id => {
    const div = document.createElement('div');
    div.className = 'glass-card pop-showcase';
    div.style = 'padding:10px; cursor:pointer; background:var(--bg-card); aspect-ratio:1; display:flex; align-items:center; justify-content:center;';
    div.innerHTML = `<img src="https://api.dicebear.com/7.x/bottts/svg?seed=${id}" style="width:100%; image-rendering:pixelated;" />`;
    div.onclick = () => {
      pImg.src = `https://api.dicebear.com/7.x/bottts/svg?seed=${id}`;
      // Update local and Firebase in real app, here we just show
    };
    pickerGrid.appendChild(div);
  });

  // ── 3D Avatar Scene (Three.js) ──────────────────────────────
  function init3DAvatar() {
    const canvas = document.getElementById('avatar-scene');
    const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
    renderer.setSize(180, 180);
    
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 100);
    camera.position.z = 4;

    // Glowing Sphere
    const geometry = new THREE.IcosahedronGeometry(1.5, 1);
    const material = new THREE.MeshPhongMaterial({
      color: 0xf97316,
      wireframe: true,
      transparent: true,
      opacity: 0.3
    });
    const sphere = new THREE.Mesh(geometry, material);
    scene.add(sphere);

    // Light
    const light = new THREE.PointLight(0xffffff, 1);
    light.position.set(5, 5, 5);
    scene.add(light);
    scene.add(new THREE.AmbientLight(0xffffff, 0.5));

    function animate() {
      requestAnimationFrame(animate);
      sphere.rotation.y += 0.01;
      sphere.rotation.x += 0.005;
      renderer.render(scene, camera);
    }
    animate();
  }
  init3DAvatar();

  // ── Progress UI ─────────────────────────────────────────────
  const progressList = document.getElementById('progress-list');
  const nProgress = JSON.parse(localStorage.getItem('nexray-progress') || '{}');
  const stages = [
    {id: 1, name: 'The Basics'},
    {id: 2, name: 'Frontend Dev'},
    {id: 3, name: 'Backend & APIs'},
    {id: 4, name: 'DevOps & CI/CD'},
    {id: 5, name: 'Pro Secrets'},
    {id: 6, name: 'Android App'},
    {id: 7, name: 'Launch & Grow'}
  ];
  
  stages.forEach(s => {
    const isDone = nProgress[`stage${s.id}`];
    const item = document.createElement('div');
    item.className = 'glass-card';
    item.style = 'display:flex; justify-content:space-between; align-items:center; padding:15px 25px;';
    item.innerHTML = `
      <div style="font-weight:700;">Stage ${s.id}: ${s.name}</div>
      <div class="badge ${isDone ? 'badge-brand' : 'badge-muted'}">${isDone ? '✓ Completed' : 'Locked'}</div>
    `;
    progressList.appendChild(item);
  });
</script>
<script src="js/main.js"></script>
</body>
</html>
